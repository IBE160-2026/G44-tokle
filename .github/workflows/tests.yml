# The test suite on Windows, macOS and Linux x Python 3.12 and 3.14, on every push (NFR-2, AD-17).
# Every test runs with the network blocked. Slow checks repeat 1,000 times on Linux / Python 3.14
# and 100 times on the other five jobs; any failing job fails the build.
# The job that runs the README's three commands is added with Story 1.7, when load-sample exists.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.4"
          python-version: ${{ matrix.python }}

      - name: Install the locked dependencies
        run: uv sync --locked

      - name: Run the tests
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.python }}" = "3.14" ]; then
            uv run pytest --repetitions 1000
          else
            uv run pytest
          fi
