<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Check a wallet · LiquidOracle{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="{{ url_for('check_a_wallet') }}">{% include "logo.svg.html" %}LiquidOracle</a>
    <nav class="mainnav" aria-label="Main">
      <a href="{{ url_for('check_a_wallet') }}"{% block nav_current %}{% endblock %}>Check a wallet</a>
      <a href="{{ url_for('scan_list') }}"{% block nav_scans_current %}{% endblock %}>Scan wallets</a>
    </nav>
    <div class="bar-tools">
      <button class="theme-toggle" type="button" id="theme-toggle" aria-label="Dark theme" aria-pressed="true" hidden>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
      </button>
      {% if offline %}<span class="offline-pill"><strong>Offline Mode</strong> · sample data only</span>{% endif %}
    </div>
  </div>
</header>

<main id="content" tabindex="-1">
  <div class="wrap">
{% block content %}{% endblock %}
  </div>
</main>
</body>
</html>
